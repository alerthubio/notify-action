name: Update Floating Major Tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-major-tag:
    # Do not advance v1 when publishing pre-releases (e.g. v1.1.0-beta.1)
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move floating major version tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping: '$RELEASE_TAG' does not match vMAJOR.MINOR.PATCH."
            exit 0
          fi

          MAJOR_TAG="v${BASH_REMATCH[1]}"
          TARGET_COMMIT=$(git rev-parse "${RELEASE_TAG}^{commit}")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -fa "$MAJOR_TAG" "$TARGET_COMMIT" -m "Release ${MAJOR_TAG} (${RELEASE_TAG})"
          git push origin "$MAJOR_TAG" --force

          echo "Updated ${MAJOR_TAG} -> ${RELEASE_TAG} (${TARGET_COMMIT})"
